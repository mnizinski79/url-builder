<div class="drawer-overlay" *ngIf="open" (click)="close()">
  <aside class="drawer" [class.drawer--wide]="activeTab === 'guide'" (click)="$event.stopPropagation()">
    <div class="drawer-header">
      <div class="drawer-tabs">
        <button
          type="button"
          class="drawer-tab"
          [class.active]="activeTab === 'saved'"
          (click)="activeTab = 'saved'"
        >Saved</button>
        <button
          type="button"
          class="drawer-tab"
          [class.active]="activeTab === 'history'"
          (click)="activeTab = 'history'"
        >History</button>
        <button
          type="button"
          class="drawer-tab"
          [class.active]="activeTab === 'guide'"
          (click)="activeTab = 'guide'"
        >Field guide</button>
      </div>
      <button type="button" class="drawer-close" (click)="close()" aria-label="Close"><ph-icon name="x" [size]="18"></ph-icon></button>
    </div>

    <div class="drawer-content">
      <ng-container *ngIf="activeTab === 'saved'">
        <div *ngIf="savedUrls.length === 0" class="empty-state">No saved URLs yet.</div>
        <app-saved-url-card
          *ngFor="let entry of savedUrls"
          [entry]="entry"
          (copyUrl)="close()"
          (deleteEntry)="deleteSaved($event)"
        ></app-saved-url-card>
      </ng-container>

      <ng-container *ngIf="activeTab === 'history'">
        <div *ngIf="history.length === 0" class="empty-state">No history yet.</div>
        <app-saved-url-card
          *ngFor="let entry of history"
          [entry]="entry"
          (copyUrl)="close()"
          (deleteEntry)="deleteHistory($event)"
        ></app-saved-url-card>
      </ng-container>

      <ng-container *ngIf="activeTab === 'guide'">
        <div class="guide-list">
          <div class="guide-card" *ngFor="let field of fieldGuide" [class.guide-card--added]="field.added">
            <div class="guide-card__header">
              <span class="guide-card__label">{{ field.label }}</span>
              <span class="guide-card__badge" *ngIf="field.added">added</span>
            </div>
            <div class="guide-card__param">
              <span class="guide-card__param-label">Parameter:</span>
              <code class="guide-card__param-value">{{ field.param }}</code>
            </div>
            <div class="guide-card__meta">
              <span class="guide-card__visibility">{{ field.visibility }}</span>
            </div>
            <p class="guide-card__desc">{{ field.description }}</p>
          </div>
        </div>
      </ng-container>
    </div>
  </aside>
</div>
